<text x="85" y="461" font-size="40" fill="#078dba" font-weight="700" text-anchor="start">19 мая 1649</text>
<text x="85" y="522" font-size="35" fill="#11144b" font-weight="600" text-anchor="start">Англия объявлена республикой</text>
<text x="85" y="578" font-size="31" fill="#11144b" font-weight="400" text-anchor="start">Новая власть — без короля.</text>
</g>
</svg>